name: Validate, build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: socialmedia-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_OWNER: jabejaranovela
  BACKEND_IMAGE: ghcr.io/jabejaranovela/social-media-dashboard-backend
  FRONTEND_IMAGE: ghcr.io/jabejaranovela/social-media-dashboard-frontend

jobs:
  backend-validation:
    name: Validate backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-backend/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: dashboard-backend/app/pom.xml

      - name: Run backend tests
        run: |
          chmod +x mvnw || true
          ./mvnw -B test

      - name: Package backend
        run: ./mvnw -B -DskipTests package

  frontend-validation:
    name: Validate frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  build-and-push:
    name: Build and push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - frontend-validation
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: dashboard-backend/app
            dockerfile: dashboard-backend/app/Dockerfile.prod
            image: ghcr.io/jabejaranovela/social-media-dashboard-backend
          - name: frontend
            context: dashboard-frontend
            dockerfile: dashboard-frontend/Dockerfile.prod
            image: ghcr.io/jabejaranovela/social-media-dashboard-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Derive short SHA
        id: revision
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ steps.revision.outputs.short_sha }}
            ${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://socialmedia.jabejarano.tech
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/socialmedia_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/socialmedia_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/socialmedia_deploy" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Copy deploy script to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REMOTE_SCRIPT: /tmp/socialmedia-deploy-${{ github.sha }}.sh
        run: |
          set -Eeuo pipefail
          scp \
            -i "$HOME/.ssh/socialmedia_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            scripts/deploy-production.sh \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_SCRIPT}"

      - name: Deploy exact revision
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          DEPLOY_SHA: ${{ github.sha }}
          REMOTE_SCRIPT: /tmp/socialmedia-deploy-${{ github.sha }}.sh
        run: |
          set -Eeuo pipefail

          ssh_command=(
            ssh
            -i "$HOME/.ssh/socialmedia_deploy"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            "${VPS_USER}@${VPS_HOST}"
          )

          cleanup_remote_script() {
            "${ssh_command[@]}" "rm -f -- '${REMOTE_SCRIPT}'" || true
          }
          trap cleanup_remote_script EXIT

          printf '%s\n' "$GHCR_TOKEN" | "${ssh_command[@]}" \
            "bash '${REMOTE_SCRIPT}' '${DEPLOY_SHA}' '${GHCR_OWNER}' '${GHCR_USERNAME}'"
